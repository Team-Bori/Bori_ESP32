## esp-nn 1.4.0 (2026-09-17): release paired with esp-tflite-micro 1.4.1 (needs esp-nn >= 1.3.0).
## Change both together and re-measure the models (docs/ADDING_A_MODEL.md).
dependencies:
  idf: ">=5.3"
  espressif/esp-tflite-micro: "==1.4.1"
  espressif/esp-nn: "==1.4.0"
