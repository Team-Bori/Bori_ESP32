# ESP32 배포 설정 (관리자용)
#
# 보드마다 다른 값을 쓰려면 이 파일을 복사해서 수정한 뒤
# ESP32_CONF 환경변수로 경로를 지정한다.
#   예) ESP32_CONF=/home/pi/boards/esp32-02.conf ./flash_model_from_github.sh ...

# 사용자 모델(MLP1 model.bin 또는 BTF1 패키지) 최대 크기 (바이트).
# 모델 파티션 크기(0x200000 = 2097152)보다 크게 잡아도 파티션 크기로 제한된다.
MAX_MODEL_BYTES=2097152

# 펌웨어(병합 이미지 firmware/<firmware_id>.bin) 최대 크기 (바이트).
# 0x0부터 쓰므로 모델 파티션 시작(0x200000 = 2097152)을 넘으면 모델을 덮어쓴다.
MAX_FIRMWARE_BYTES=2097152

# 플래시 통신 속도
FLASH_BAUD=921600

# 테스트 파일 스트리밍(esp_monitor.py run-test) 중에 올릴 시리얼 속도.
# 115200, 230400, 460800, 921600 중 하나. 연결이 불안정하면 낮춘다.
STREAM_BAUD=921600

# 플래시 후 부팅 확인: ready 대기 시간과, ready 이후 재부팅 여부를 지켜보는 시간 (초)
BOOT_TIMEOUT=15
BOOT_SETTLE=3

# 세션 종료(반납) 시 보드를 되돌릴 기본 펌웨어와 기본 모델 (reset_board.sh).
# 둘은 짝이 맞아야 한다: mlp 펌웨어 + MLP1 모델, 또는 tflm_runtime 펌웨어 + BTF1 패키지.
# 비워 두면 저장소의 firmware/mlp.bin, models/mlp/default_model.bin을 쓴다.
# 예) TFLM 런타임 보드:
# DEFAULT_FIRMWARE=/home/pi/Bori_ESP32/firmware/tflm_runtime.bin
# DEFAULT_MODEL=/home/pi/Bori_ESP32/models/sine_regression/default_model.bin
